[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maintainers-copilot-modelserver"
version = "0.1.0"
description = "FastAPI inference server for NLP models (classifier, NER, summarizer)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Author", email = "author@example.com" }]

dependencies = [
    "fastapi[standard]==0.109.0",
    "uvicorn[standard]==0.27.0",
    "pydantic==2.5.2",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.0.0",
    "httpx==0.25.2",
    "torch==2.1.2",
    "transformers==4.36.2",
    "spacy==3.7.2",
    "structlog==23.3.0",
    "langsmith==0.1.14",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "ruff==0.1.8",
    "black==23.12.1",
    "isort==5.13.2",
    "mypy==1.7.1",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"

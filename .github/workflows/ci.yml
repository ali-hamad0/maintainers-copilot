name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # --------------------------------------------------------------------------
  # Job 1 — Python lint + type check (backend)
  # --------------------------------------------------------------------------
  lint:
    name: Lint & type-check (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install --quiet uv

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: ruff lint
        working-directory: backend
        run: uv run ruff check .

      - name: black format check
        working-directory: backend
        run: uv run black --check .

      - name: mypy type check
        working-directory: backend
        run: uv run mypy app/

  # --------------------------------------------------------------------------
  # Job 2 — Redaction layer tests
  #
  # Mandatory gate: every push must prove that secrets cannot leave the service
  # boundary via logs, traces, or the memory write path.
  # No external services required — pure-Python unit + integration tests.
  # --------------------------------------------------------------------------
  redaction-test:
    name: Redaction layer tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install --quiet uv

      - name: Install backend dependencies (including dev extras for pytest)
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Run redaction tests
        working-directory: backend
        run: uv run pytest tests/test_redaction.py -v --no-cov

  # --------------------------------------------------------------------------
  # Job 3 — Classification golden-set eval gate
  #
  # Runs TF-IDF+LR (retrained on the committed 40-example CI fixture) against
  # the 25-example golden set and fails if macro-F1 drops below the committed
  # threshold in backend/eval_thresholds.yaml.
  #
  # DistilBERT: requires MODELSERVER_URL secret → skipped if absent.
  # Gemini:     requires GEMINI_API_KEY secret → skipped if absent.
  #
  # To force a regression locally:
  #   1. Lower tfidf_lr.f1_macro threshold in backend/eval_thresholds.yaml to 0.99
  #   2. Run: python evals/run_classification_eval.py --use-ci-fixture \
  #              --skip-distilbert --skip-gemini --skip-minio-upload
  #   3. Observe exit code 1 with "FAIL — threshold regression" message
  # --------------------------------------------------------------------------
  eval-gate:
    name: Classification eval gate
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install --quiet uv

      - name: Install backend dependencies (provides sklearn, httpx, pyyaml, numpy)
        working-directory: backend
        run: uv sync --frozen

      - name: Validate golden set structure
        working-directory: backend
        run: |
          uv run python - <<'EOF'
          import json
          from pathlib import Path

          golden_path = Path("../evals/golden/classification.jsonl")
          valid_labels = {"bug", "feature", "docs", "question"}
          rows = []
          with golden_path.open() as fh:
              for i, line in enumerate(fh, 1):
                  line = line.strip()
                  if not line:
                      continue
                  row = json.loads(line)
                  assert "id" in row, f"line {i}: missing 'id'"
                  assert "text" in row, f"line {i}: missing 'text'"
                  assert "label" in row, f"line {i}: missing 'label'"
                  assert row["label"] in valid_labels, (
                      f"line {i}: invalid label {row['label']!r}"
                  )
                  assert len(row["text"]) > 20, f"line {i}: text too short"
                  rows.append(row)
          assert len(rows) == 25, f"Expected 25 golden examples, got {len(rows)}"
          counts = {}
          for r in rows:
              counts[r["label"]] = counts.get(r["label"], 0) + 1
          print(f"Golden set OK: {len(rows)} examples  {counts}")
          EOF

      - name: Validate threshold file (no zeros, no 'disabled')
        working-directory: backend
        run: |
          uv run python - <<'EOF'
          import yaml
          from pathlib import Path

          thresholds = yaml.safe_load(Path("eval_thresholds.yaml").read_text())

          def walk(node, path=""):
              if isinstance(node, dict):
                  for k, v in node.items():
                      walk(v, f"{path}.{k}" if path else k)
              elif isinstance(node, (int, float)):
                  assert node != 0, f"Threshold {path} = 0 (CLAUDE.md §4 #5)"
                  assert node > 0, f"Threshold {path} is negative"
              elif isinstance(node, str):
                  assert node.lower() != "disabled", (
                      f"Threshold {path} = 'disabled' (CLAUDE.md §4 #5)"
                  )

          walk(thresholds)
          print("Threshold file OK — no zeros or 'disabled' values")
          EOF

      - name: Run classification eval (TF-IDF+LR, CI fixture)
        working-directory: backend
        env:
          MODELSERVER_URL: ${{ secrets.MODELSERVER_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          SKIP_BERT=""
          SKIP_GEMINI=""

          if [ -z "$MODELSERVER_URL" ]; then
            SKIP_BERT="--skip-distilbert"
          fi

          if [ -z "$GEMINI_API_KEY" ]; then
            SKIP_GEMINI="--skip-gemini"
          fi

          uv run python ../evals/run_classification_eval.py \
            --use-ci-fixture \
            $SKIP_BERT \
            $SKIP_GEMINI \
            --skip-minio-upload \
            --report-path /tmp/eval_report.json

      - name: Upload eval report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.sha }}
          path: /tmp/eval_report.json
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  # Job 3 — RAG golden-set eval gate
  #
  # Mandatory gate: retrieval metrics from the pre-computed CI fixture
  # (no DB required).  hit@5 must meet eval_thresholds.yaml rag.hit_at_5.
  #
  # Optional gate: LLM judge generation metrics (faithfulness, answer_relevance)
  # — only enforced if GEMINI_API_KEY secret is configured.  Skips gracefully
  # if absent so CI does not block without API access.
  #
  # Regression demo (local):
  #   1. Lower rag.hit_at_5 threshold to 0.99 in backend/eval_thresholds.yaml
  #   2. python evals/run_rag_eval.py --skip-judge --skip-minio-upload
  #   3. Observe exit code 1 with "FAIL: rag.hit_at_5: 0.8000 < threshold 0.99"
  # --------------------------------------------------------------------------
  rag-eval-gate:
    name: RAG eval gate
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install --quiet uv

      - name: Install backend dependencies (provides httpx, pyyaml)
        working-directory: backend
        run: uv sync --frozen

      - name: Validate RAG golden set structure
        working-directory: backend
        run: |
          uv run python - <<'EOF'
          import json
          from pathlib import Path

          golden_path = Path("../evals/golden/rag.jsonl")
          fixture_path = Path("../evals/fixtures/rag_retrieval_ci.jsonl")
          valid_categories = {"common", "ambiguous", "multi_doc", "not_in_corpus"}

          def load_jsonl(p):
              rows = []
              with p.open() as fh:
                  for i, line in enumerate(fh, 1):
                      line = line.strip()
                      if line:
                          rows.append((i, json.loads(line)))
              return rows

          golden_rows = load_jsonl(golden_path)
          assert len(golden_rows) == 25, f"Expected 25 golden rows, got {len(golden_rows)}"
          for i, row in golden_rows:
              assert "id" in row, f"line {i}: missing 'id'"
              assert "question" in row, f"line {i}: missing 'question'"
              assert "ideal_answer" in row, f"line {i}: missing 'ideal_answer'"
              assert "category" in row, f"line {i}: missing 'category'"
              assert row["category"] in valid_categories, (
                  f"line {i}: invalid category {row['category']!r}"
              )
              assert "n_relevant" in row, f"line {i}: missing 'n_relevant'"
              assert isinstance(row["n_relevant"], int), f"line {i}: n_relevant must be int"
              assert len(row["question"]) > 10, f"line {i}: question too short"

          fixture_rows = load_jsonl(fixture_path)
          assert len(fixture_rows) == 25, f"Expected 25 fixture rows, got {len(fixture_rows)}"
          for i, row in fixture_rows:
              assert "id" in row, f"line {i}: fixture missing 'id'"
              rel = row.get("top_10_relevance", [])
              assert len(rel) == 10, f"line {i}: top_10_relevance must have 10 entries"
              assert all(isinstance(v, bool) for v in rel), (
                  f"line {i}: top_10_relevance must be list of bool"
              )

          hand_labelled = [r for _, r in golden_rows if r.get("hand_labelled")]
          assert len(hand_labelled) == 5, (
              f"Expected 5 hand-labelled examples, got {len(hand_labelled)}"
          )

          from collections import Counter
          cats = Counter(r["category"] for _, r in golden_rows)
          print(f"Golden set OK: 25 examples  {dict(cats)}")
          print(f"Fixture OK: 25 rows with top_10_relevance")
          print(f"Hand-labelled: {len(hand_labelled)} examples")
          EOF

      - name: Validate threshold file (no zeros, no 'disabled') — RAG section
        working-directory: backend
        run: |
          uv run python - <<'EOF'
          import yaml
          from pathlib import Path

          thresholds = yaml.safe_load(Path("eval_thresholds.yaml").read_text())
          rag = thresholds.get("rag", {})
          assert rag, "Missing 'rag' section in eval_thresholds.yaml"

          def walk(node, path=""):
              if isinstance(node, dict):
                  for k, v in node.items():
                      walk(v, f"{path}.{k}" if path else k)
              elif isinstance(node, (int, float)):
                  assert node != 0, f"Threshold {path} = 0 (CLAUDE.md §4 #5)"
              elif isinstance(node, str):
                  assert node.lower() != "disabled", (
                      f"Threshold {path} = 'disabled' (CLAUDE.md §4 #5)"
                  )

          walk(rag, "rag")
          print(f"RAG threshold section OK: {rag}")
          EOF

      - name: Run RAG eval (retrieval fixture, skip judge if no API key)
        working-directory: backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          SKIP_JUDGE=""
          if [ -z "$GEMINI_API_KEY" ]; then
            SKIP_JUDGE="--skip-judge"
          fi

          uv run python ../evals/run_rag_eval.py \
            $SKIP_JUDGE \
            --skip-minio-upload \
            --report-path /tmp/rag_eval_report.json

      - name: Upload RAG eval report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-report-${{ github.sha }}
          path: /tmp/rag_eval_report.json
          if-no-files-found: warn

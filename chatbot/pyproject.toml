[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maintainers-copilot-chatbot"
version = "0.1.0"
description = "Streamlit admin UI for Maintainer's Copilot"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Author", email = "author@example.com" }]

dependencies = [
    "streamlit==1.29.0",
    "httpx==0.25.2",
    "pydantic==2.5.2",
    "python-dotenv==1.0.0",
    "plotly==5.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "ruff==0.1.8",
    "black==23.12.1",
    "isort==5.13.2",
    "mypy==1.7.1",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

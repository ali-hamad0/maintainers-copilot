# eval_thresholds.yaml
# Committed thresholds for both eval suites.  Setting any value to 0 or "disabled"
# causes the api to refuse to boot (CLAUDE.md §4 #5).
# All values are minimum acceptable metrics on the 25-example golden set.
#
# TF-IDF+LR thresholds calibrated to CI fixture (40 training examples, DECISIONS.md §D-P7-05):
#   CI-fixture measured on golden set: accuracy=0.84, macro-F1=0.8264
#   Full-train measured on test split: accuracy=0.9113, macro-F1=0.8804
#   CI gate runs with --use-ci-fixture, so thresholds must reflect CI-fixture performance.
#   threshold = CI-fixture measured - 0.05 buffer to absorb golden-set variance.
# DistilBERT/Gemini thresholds remain extrapolated (pre-augmentation test split).

classification:
  accuracy: 0.79          # API bootcheck floor — CI-fixture measured 0.84; buffer 0.05
  f1_macro: 0.77          # API bootcheck floor — CI-fixture measured 0.8264; buffer 0.05

  models:
    tfidf_lr:
      accuracy: 0.79      # CI-fixture measured 0.84 on 25-example golden set; threshold = actual - 0.05
      f1_macro: 0.77      # CI-fixture measured 0.8264; question F1 0.75 (3 golden examples)
    distilbert:
      accuracy: 0.85      # v2 weights: test accuracy 0.9021 on augmented split; threshold = actual - 0.05
      f1_macro: 0.83      # v2 weights: test macro-F1 0.8893; question F1 0.98; threshold = actual - 0.05
    gemini:
      accuracy: 0.68      # Gemini test accuracy 0.9357 pre-augmentation; re-eval pending
      f1_macro: 0.60      # Gemini test macro-F1 0.6888 pre-augmentation; re-eval pending

rag:
  # Calibrated from pre-computed CI fixture (25-example golden set, 2026-05-19).
  # Fixture measured: hit@5=0.80, MRR@10=0.531, Recall@10=0.921
  # faithfulness / answer_relevance measured on ideal-answer golden set by
  # Gemini 2.5 Flash judge (frozen prompt prompts/rag_judge.md v1.0).
  # Thresholds = measured - 0.05 buffer (same policy as classification §D-P7-02).
  hit_at_5: 0.70          # measured 0.80; threshold = actual - 0.10 (5 not-in-corpus always 0)
  faithfulness: 0.75      # answer grounded in retrieved context
  answer_relevance: 0.70  # answer addresses the question
